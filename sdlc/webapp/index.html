<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ai-sdlc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="탐색">
    <a class="brand" href="#/">
      <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="46 17" transform="rotate(-60 13 13)"/><circle cx="13" cy="13" r="3.2" fill="var(--gate)"/></svg>
      ai-sdlc
    </a>
    <nav class="nav">
      <a href="#/" data-route="overview">개요</a>
      <a href="#/board" data-route="board">작업 보드</a>
      <a href="#/branch" data-route="branch">브랜치 점검</a>
      <a href="#/incidents" data-route="incidents">인시던트</a>
    </nav>
    <div class="side-foot">
      <div class="repo"><span class="lab">저장소</span><b id="repo-name">—</b><code id="repo-branch"></code></div>
      <a href="/about" target="_blank" rel="noopener">ai-sdlc 소개 ↗</a>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><span class="eyebrow" id="crumb"></span><h1 id="title">개요</h1></div>
      <div class="top-actions">
        <button class="btn" type="button" id="refresh" title="다시 불러오기">새로고침</button>
        <button class="btn primary" type="button" id="new-work">새 작업</button>
      </div>
    </header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<dialog id="new-dialog" aria-labelledby="new-h">
  <form id="new-form" method="dialog">
    <h2 id="new-h">새 작업 — 의도 초안</h2>
    <p class="muted">intent.md 초안(draft)을 만듭니다. 근거와 문제를 채운 뒤 제출하면 제품 오너의 게이트로 갑니다.</p>
    <label for="nf-title">제목</label>
    <input id="nf-title" name="title" required maxlength="80" placeholder="예: Checkout latency for EU users">
    <label for="nf-owner">책임 제품 오너</label>
    <input id="nf-owner" name="owner" required placeholder="이름 &lt;email&gt;">
    <label for="nf-tier">위험 등급</label>
    <select id="nf-tier" name="tier">
      <option value="T0">T0 · 문서</option><option value="T1" selected>T1 · 일반 기능</option>
      <option value="T2">T2 · API·스키마·의존성</option><option value="T3">T3 · 인증·결제·규제·통제</option>
    </select>
    <p class="err" id="nf-err" hidden></p>
    <div class="row-end">
      <button class="btn" type="button" id="nf-cancel">취소</button>
      <button class="btn primary" type="submit">초안 만들기</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/detail.js"></script>
</body>
</html>
