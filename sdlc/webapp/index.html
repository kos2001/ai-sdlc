<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ai-sdlc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/intro.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation">
    <a class="brand" href="#/">
      <span id="brand-mark" class="mark"></span>
      ai-sdlc
    </a>
    <nav class="nav">
      <a href="#/intro" data-route="intro" data-i18n="nav.intro">소개 · 무엇이 다른가</a>
      <a href="#/guide" data-route="guide" data-i18n="nav.guide">가이드 · 전체 이야기</a>
      <a href="#/" data-route="overview" data-i18n="nav.overview">개요</a>
      <a href="#/board" data-route="board" data-i18n="nav.board">작업 보드</a>
      <a href="#/branch" data-route="branch" data-i18n="nav.branch">브랜치 점검</a>
      <a href="#/incidents" data-route="incidents" data-i18n="nav.incidents">인시던트</a>
      <a href="#/lessons" data-route="lessons" data-i18n="nav.lessons">개선 루프</a>
    </nav>
    <div class="side-foot">
      <div class="repo"><span class="lab" data-i18n="side.repo">저장소</span><b id="repo-name">—</b><code id="repo-branch"></code></div>
      <a href="/about" target="_blank" rel="noopener" data-i18n="side.about">ai-sdlc 소개 ↗</a>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><span class="eyebrow" id="crumb"></span><h1 id="title"></h1></div>
      <div class="top-actions">
        <div class="lang" role="group" aria-label="Language / 언어">
          <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
          <button type="button" data-lang="en" aria-pressed="false">English</button>
        </div>
        <button class="btn" type="button" id="refresh" data-i18n="top.refresh">새로고침</button>
        <button class="btn primary" type="button" id="new-work" data-i18n="top.new">새 작업</button>
      </div>
    </header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<dialog id="new-dialog" aria-labelledby="new-h">
  <form id="new-form" method="dialog">
    <h2 id="new-h" data-i18n="new.h">새 작업 — 의도 초안</h2>
    <p class="muted" data-i18n="new.lede"></p>
    <label for="nf-title" data-i18n="new.title">제목</label>
    <input id="nf-title" name="title" required maxlength="80" data-i18n-ph="new.titlePh">
    <label for="nf-owner" data-i18n="new.owner">책임 제품 오너</label>
    <input id="nf-owner" name="owner" required data-i18n-ph="new.ownerPh">
    <label for="nf-tier" data-i18n="new.tier">위험 등급</label>
    <select id="nf-tier" name="tier">
      <option value="T0" data-i18n="tier.T0">T0</option><option value="T1" selected data-i18n="tier.T1">T1</option>
      <option value="T2" data-i18n="tier.T2">T2</option><option value="T3" data-i18n="tier.T3">T3</option>
    </select>
    <p class="err" id="nf-err" hidden></p>
    <div class="row-end">
      <button class="btn" type="button" id="nf-cancel" data-i18n="new.cancel">취소</button>
      <button class="btn primary" type="submit" data-i18n="new.create">초안 만들기</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/icons.js"></script>
<script src="/i18n.js"></script>
<script src="/i18n-en.js"></script>
<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/detail.js"></script>
<script src="/intro-data.js"></script>
<script src="/intro.js"></script>
<script src="/guide.js"></script>
<script src="/lessons.js"></script>
</body>
</html>
